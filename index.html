<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8EBEF">
<title>오르락 미션 빙고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 볼트 구멍이 뚫린 벽 패널 위에 폰 너비 한 줄. 조마다 홀드 색 테이프 하나. 큰 숫자와 이름에만 디스플레이 서체. */
:root{
  --wall:#E8EBEF; --panel:#F8F9FB; --chalk:#FFFFFF;
  --ink:#171A21; --ink-2:#555C6A; --ink-3:#8A91A0; --line:#CFD4DC;
  --bad:#C92A2A;
  --display:"Bagel Fat One","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --c:var(--ink); --cf:#fff;
  color-scheme:light;
}
.tc1{--c:#FFC533;--cf:#171A21}
.tc2{--c:#FF7F32;--cf:#171A21}
.tc3{--c:#108A5C;--cf:#fff}
.tc4{--c:#2D5BE3;--cf:#fff}
.tc5{--c:#E23B3B;--cf:#fff}
.tc6{--c:#7A4FD8;--cf:#fff}
.tc7{--c:#DB3A82;--cf:#fff}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;color:var(--ink);font:400 15px/1.55 var(--body);
  background:var(--wall) radial-gradient(circle at center,rgba(23,26,33,.15) 1.6px,transparent 2.3px) 0 0/30px 30px;
  -webkit-tap-highlight-color:transparent;
}
body.noscroll{overflow:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img,video{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

#app{
  max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:18px;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(36px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}

/* ── 공통 부품 ─────────────────────────── */
.tape{
  display:inline-block;padding:3px 12px 4px;background:var(--c);color:var(--cf);
  font-weight:700;font-size:13px;line-height:1.3;letter-spacing:.02em;transform:rotate(-2deg);white-space:nowrap;
  clip-path:polygon(0 0,100% 0,calc(100% - 3px) 22%,100% 45%,calc(100% - 3px) 70%,100% 100%,0 100%,3px 78%,0 52%,3px 26%);
}
.hold{position:relative;display:grid;place-items:center;background:var(--c);color:var(--cf)}
.hold::after{content:"";position:absolute;width:18%;aspect-ratio:1;border-radius:50%;background:rgba(23,26,33,.55);box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.h0{border-radius:58% 42% 47% 53%/46% 55% 45% 54%}
.h1{border-radius:41% 59% 62% 38%/55% 43% 57% 45%}
.h2{border-radius:63% 37% 44% 56%/40% 60% 40% 60%}
.h3{border-radius:47% 53% 36% 64%/61% 44% 56% 39%}
.h4{border-radius:52% 48% 60% 40%/38% 52% 48% 62%}
.h5{border-radius:36% 64% 51% 49%/52% 38% 62% 48%}
.h6{border-radius:60% 40% 40% 60%/57% 61% 39% 43%}
.h7{border-radius:44% 56% 58% 42%/45% 40% 60% 55%}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:10px 18px;
  border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;text-align:center;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.98)}
.btn.team{background:var(--c);color:var(--cf)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.quiet{background:transparent;color:var(--ink-2);min-height:44px;font-weight:600;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.armed{background:var(--bad);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;width:auto;padding:8px 16px}

.field{display:flex;flex-direction:column;gap:7px}
.field.row{flex-direction:row;align-items:center;justify-content:space-between;gap:16px}
.label,.field>label{font-weight:700;font-size:14px}
.label small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px;line-height:1.45;margin-top:2px}
.inp{
  width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  font:inherit;font-size:16px;background:#fff;color:var(--ink);
}
textarea.inp{resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--ink-2)}
.err{font-size:13.5px;color:var(--bad);font-weight:600}
.switch{flex:none;width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--c);color:var(--cf);box-shadow:none}
.sec{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}

/* ── 상단 바 ─────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wm{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:24px;line-height:1}
.wm .tape{font-family:var(--body);font-size:11.5px}
.me{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{flex:none;min-height:44px;padding:0 6px 0 10px;color:var(--ink-2);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:600;font-size:14px;color:var(--ink-2);align-self:flex-start;margin-bottom:-12px}

/* ── 로그인 ─────────────────────────── */
.login{display:flex;flex-direction:column;gap:22px;flex:1;justify-content:center;padding-block:12px}
.route{display:flex;align-items:flex-end;gap:7px;height:96px}
.route .hold{width:32px;height:28px;flex:none}
.route .hold:nth-child(1){margin-bottom:0}
.route .hold:nth-child(2){margin-bottom:14px;width:26px;height:26px}
.route .hold:nth-child(3){margin-bottom:22px}
.route .hold:nth-child(4){margin-bottom:38px;width:38px;height:30px}
.route .hold:nth-child(5){margin-bottom:46px;width:26px;height:24px}
.route .hold:nth-child(6){margin-bottom:58px}
.route .hold:nth-child(7){margin-bottom:66px;width:36px;height:30px}
.login h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,22vw,96px);line-height:.95;letter-spacing:-.01em}
.login .sub{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;font-weight:600}
.login .sub .tape{font-size:15px}
.login .when{font-size:14px;color:var(--ink-2)}
.card{background:var(--panel);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 0 #fff inset,0 14px 30px -18px rgba(23,26,33,.4)}
.demo{font-size:12.5px;color:var(--ink-2);text-align:center}
.loading{flex:1;display:grid;place-content:center;gap:10px;text-align:center;color:var(--ink-2)}
.loading b{font-family:var(--display);font-weight:400;font-size:44px;color:var(--ink)}

/* ── 홈 ─────────────────────────── */
.hero{
  position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:end;
  background:var(--c);color:var(--cf);border-radius:20px;padding:18px 20px 20px;
}
.hero-k{grid-column:1/-1;font-weight:700;font-size:13px;letter-spacing:.04em;opacity:.85}
.hero-n{font-family:var(--display);font-size:92px;line-height:.9}
.hero-n small{font-size:38px;margin-left:2px}
.hero-r{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;min-width:0}
.hero-p{font-size:15px;font-weight:600}
.hero-p b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.hero-s{font-size:13px;opacity:.9}
.hero-go{grid-column:1/-1;margin-top:16px;display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:13px;background:var(--ink);color:#fff;font-weight:700}
.hero .hold{position:absolute;--c:rgba(23,26,33,.14);--cf:transparent}
.hero .hold::after{background:rgba(23,26,33,.2);box-shadow:none}
.note{background:var(--panel);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--ink-2)}
.adminlink{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 16px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700}
.adminlink span{font-weight:400;font-size:12.5px;opacity:.75}
.rows{background:var(--panel);border-radius:18px;overflow:hidden;margin-top:10px}
.trow{display:grid;grid-template-columns:34px 50px 1fr auto;align-items:center;gap:10px;padding:13px 16px 13px 12px;min-height:68px}
.rk{justify-self:center;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.rk.r1{background:var(--ink);color:#fff;border-radius:99px;padding:2px 7px}
.sec+.hint{margin-top:2px}
.trow+.trow{border-top:1px solid var(--line)}
.trow .tape{font-family:var(--display);font-weight:400;font-size:19px;padding:3px 9px 4px;justify-self:start}
.trow-m{min-width:0}
.trow-m b{font-size:15px;font-weight:700}
.trow-m b em{font-style:normal;font-weight:600;font-size:11.5px;background:var(--ink);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.trow-m p{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(5,6px);gap:2px}
.mini i{width:6px;height:6px;border-radius:1.5px;background:var(--line)}
.mini i.d{background:var(--c)}

/* ── 조 페이지 ─────────────────────────── */
.teamhead{display:flex;align-items:flex-end;gap:14px}
.bignum{flex:none;white-space:nowrap;font-family:var(--display);font-size:84px;line-height:.86;color:var(--c)}
.bignum small{font-size:36px;color:var(--ink);margin-left:2px}
.who{font-size:13.5px;color:var(--ink-2);padding-bottom:6px;min-width:0}
.who b{display:block;color:var(--ink);font-size:14px}
.prog{display:flex;flex-direction:column;gap:10px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog-n{font-weight:600}
.prog-n b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goal{display:flex;flex-direction:column;gap:1px;padding:9px 12px 10px;border-radius:10px;background:var(--panel);font-size:12.5px;color:var(--ink-2)}
.goal b{font-size:14px;color:var(--ink)}
.goal.on{background:var(--c);color:var(--cf)}
.goal.on b{color:var(--cf)}
.tally{display:flex;flex-wrap:wrap;gap:6px}
.tally span{font-size:12.5px;line-height:1.3;background:var(--panel);color:var(--ink-2);border-radius:99px;padding:4px 10px}
.tally b{color:var(--ink);font-weight:700}
.tally .full{background:var(--c);color:var(--cf)}
.tally .full b{color:inherit}
.tally b+b{margin-left:4px}
.tally em{font-style:normal;font-size:12px;color:var(--ink-3);align-self:center;margin-right:2px}

.board{
  position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px;
  background:var(--panel);border-radius:10px;box-shadow:0 1px 0 #fff inset,0 18px 34px -22px rgba(23,26,33,.5);
}
.bolt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--ink-3);box-shadow:inset 0 1px 0 rgba(0,0,0,.4)}
.bolt:nth-of-type(1){top:5px;left:5px}.bolt:nth-of-type(2){top:5px;right:5px}
.bolt:nth-of-type(3){bottom:5px;left:5px}.bolt:nth-of-type(4){bottom:5px;right:5px}
.cell{position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden;display:grid;place-items:center;min-width:0}
.board{--tc:var(--c)}
.cell.empty{background:var(--wall)}
.cell.empty .hold{width:54%;height:48%;--c:#C3C9D2}
.cell.empty.can{box-shadow:inset 0 0 0 1.5px var(--line)}
.cell.empty.mid{box-shadow:inset 0 0 0 2px var(--tc);background:#fff}
.cell .ek{font-size:10.5px;font-weight:700;line-height:1.25;text-align:center;color:var(--ink)}
.cell.done{background:var(--c);color:var(--cf)}
.cell.done img,.cell.done video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell.done .ct{padding:0 4px;font-size:10px;font-weight:700;text-align:center;line-height:1.25;max-height:3.75em;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.cell .kb{position:absolute;left:0;bottom:0;font-size:9.5px;font-weight:700;line-height:1.3;padding:1px 5px 2px;background:var(--ink);color:#fff;border-radius:0 5px 0 0}
.cell.k-duel .ct{max-height:2.5em;padding:0 9px}
.cell .kb,.cell .pb{z-index:3}
/* 빙고가 된 줄의 칸에는 테두리를 두른다 */
.cell.line::after{content:"";position:absolute;inset:0;border:3px solid var(--ink);border-radius:inherit;pointer-events:none}
.cell.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.cta{display:flex;flex-direction:column;gap:8px}
.cta p{font-size:13.5px;color:var(--ink-2);text-align:center;word-break:keep-all;text-wrap:balance}

/* ── 미션 상세 ─────────────────────────── */
.mission{background:var(--panel);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.mission-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mission .no{font-family:var(--display);font-size:15px;color:var(--ink-2)}
.mission h1{font-size:23px;line-height:1.3;font-weight:700;word-break:keep-all}
.mission p{color:var(--ink-2);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.state{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--ink);color:#fff}
.proof{display:flex;flex-direction:column;gap:14px}
.gallery{display:flex;flex-direction:column;gap:8px}
.gallery img,.gallery video{width:100%;border-radius:14px;background:#000;max-height:76dvh;object-fit:contain}
.proof h2{font-size:19px;line-height:1.35;word-break:keep-all}
.proof .desc{white-space:pre-wrap;overflow-wrap:anywhere}
.by{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.by span{background:var(--c);color:var(--cf);border-radius:99px;padding:3px 11px;font-weight:700;font-size:13px}
.stack{display:flex;flex-direction:column;gap:8px}

/* ── 시트 ─────────────────────────── */
#sheet .backdrop{position:fixed;inset:0;background:rgba(23,26,33,.78);z-index:40;animation:fade .2s}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;max-height:94dvh;overflow:auto;
  background:var(--panel);border-radius:22px 22px 0 0;display:flex;flex-direction:column;gap:16px;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  animation:up .28s cubic-bezier(.2,.8,.2,1);
}
.sheet form{display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:20px}
.sheet-sub{font-size:13.5px;color:var(--ink-2);margin-top:-10px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:46px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--cf);box-shadow:none}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mthumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover}
.mthumb button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:rgba(23,26,33,.8);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center}
.mthumb button::before{content:"";position:absolute;inset:-9px}
.madd{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--ink-3);display:grid;place-content:center;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--ink-2);cursor:pointer;background:#fff}
.madd b{font-size:24px;line-height:1;font-weight:400;color:var(--ink)}
.madd input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.meter{height:8px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px}

/* ── 문제 · 동그라미 · 빙고 진행 ─────────────────────────── */
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(23,26,33,.28)}
.sw{display:inline-flex;gap:3px;align-items:center;margin-right:8px;vertical-align:-2px}
.sw i{display:block;width:14px;height:14px;box-shadow:inset 0 0 0 1px rgba(23,26,33,.28)}
.sw .tp{border-radius:3px}
.sw .hd{border-radius:50%}
.cell .pb{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:2px 0 3px;background:rgba(23,26,33,.74);color:#fff;font-size:9.5px;font-weight:700;line-height:1.2}
.cell .pb .sw{margin:0;gap:2px}
.cell .pb .sw i{width:8px;height:8px;box-shadow:0 0 0 1px rgba(255,255,255,.75)}
.cell.k-problem .ct{align-self:start;margin-top:8px;max-height:2.5em}
/* 동그라미: 분필로 한 번 휘갈긴 자국. 칸마다 방향을 조금씩 달리한다. */
.ring{position:absolute;overflow:visible;pointer-events:none;fill:var(--ink)}
.ring.v1{transform:scaleX(-1)}.ring.v2{transform:scaleY(-1)}.ring.v3{transform:scale(-1)}
.cell .ring{left:4%;top:4%;width:92%;height:92%;z-index:2;fill:#fff;filter:drop-shadow(0 0 .7px rgba(23,26,33,.95)) drop-shadow(0 1px 1.5px rgba(23,26,33,.6))}
.cell.k-problem .ring{left:5%;top:1%;width:90%;height:72%}   /* 아래쪽 색 표시 띠는 가리지 않는다 */
.cell.callable{outline:2.5px dashed var(--ink);outline-offset:1.5px}
.mini i.h{background:var(--ink)}
.gbar{display:flex;flex-direction:column;gap:8px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px}
.gbar>b{font-size:16px}
.gb-order{display:flex;flex-wrap:wrap;gap:6px}
.gb-order span{font-size:12.5px;font-weight:700;line-height:1.3;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16)}
.gb-order span.on{background:var(--c);color:var(--cf)}
.gb-order.ink span{background:var(--wall);color:var(--ink-2)}
.gb-order.ink span.on{background:var(--c);color:var(--cf)}
.gb-last{font-size:13px;opacity:.85}
.gb-last b{font-weight:700}

<script>
/* ════════════════════════════════════════════════════════════
   서버 설정 — 비워 두면 "데모 모드"(이 브라우저에만 저장).
   Supabase 프로젝트를 만들고 supabase-setup.sql 을 실행한 뒤
   아래 두 값을 채우면 42명이 같은 데이터를 봅니다.
   ════════════════════════════════════════════════════════════ */
const CONFIG = {
  supabaseUrl: 'https://pzzejazyxpkpdzqzetdw.supabase.co',
  supabaseKey: 'sb_publishable_gqAy47JhC_ts6VM18f-2bQ_SSuTqv65' // 공개용(publishable) 키. secret 키는 절대 여기에 넣지 마세요.
};

const PASSWORD = '0000';
const TEAMS = 7, N = 5, CELLS = N * N, CENTER = 12;
/* 가운데 한 칸은 팀 인증샷, 나머지 24칸은 문제 18칸 + 팀 대결 6칸. 어느 칸을 무엇으로 채울지는 조가 정한다. */
const QUOTA = { photo: 1, problem: 18, duel: 6 };
/* 이 줄 수를 먼저 완성한 조부터 끝나고 순위가 정해진다 */
const GOAL_LINES = 6;
/* 추첨권: 1·2등 조는 한 사람당 3장, 3~5등 조는 2장, 6·7등 조는 1장. 1~84번을 무작위로 나누고 85~100번은 운영진이 직접 준다. */
const ticketsFor = pos => (pos <= 2 ? 3 : pos <= 5 ? 2 : 1);
const DRAW_MAX = 84, EXTRA_FROM = 85, EXTRA_TO = 100;
const KIND = { photo: '인증샷', problem: '문제', duel: '팀 대결' };
/* 문제는 섹터 → 난이도(테이프 색) → 홀드 색으로 고른다. 목록 자체는 운영진 페이지에서 등록한다. */
const SECTORS = ['1섹터', '2~3섹터', '4~5섹터', 'Island 섹터'], SECTOR_SHORT = ['1', '2·3', '4·5', 'IS'];
/* 이번 행사에서 쓰는 섹터만 고를 수 있다. 저장된 문제의 섹터 번호가 SECTORS 순서를 가리키므로 위 목록 자체는 줄이지 않는다. */
const SECTOR_ON = [1, 2];
const LEVELS = [['빨강', '#E5372E'], ['주황', '#F5821F'], ['노랑', '#F7CB15'], ['초록', '#2E9E4F'], ['파랑', '#2D6BE0'], ['남색', '#27357E'], ['보라', '#8747D1'], ['회색', '#9AA0A8'], ['검정', '#1B1D22']];
const HOLDS = [['빨강', '#E5372E'], ['주황', '#F5821F'], ['노랑', '#F7CB15'], ['초록', '#2E9E4F'], ['파랑', '#2D6BE0'], ['남색', '#27357E'], ['보라', '#8747D1'], ['분홍', '#EE6FA8'], ['하늘', '#6CC4F0'], ['흰색', '#FFFFFF'], ['회색', '#9AA0A8'], ['검정', '#1B1D22'], ['갈색', '#8A5A33']];
/* 빙고 줄: 가로 5, 세로 5, 대각선 2 */
const LINES = (() => {
  const L = [], ix = [0, 1, 2, 3, 4];
  ix.forEach(r => L.push(ix.map(c => r * N + c)));
  ix.forEach(c => L.push(ix.map(r => r * N + c)));
  L.push(ix.map(k => k * N + k), ix.map(k => k * N + (N - 1 - k)));
  return L;
})();
const MAX_MEDIA = 4;
/* 올라온 사진 합계가 이 값을 넘으면 더 올리지 못하게 막는다 (Supabase 무료 저장 1GB 기준). */
const STORAGE_BUDGET_MB = 900;
const EVENT = { date: '11.28 토', place: '피커스 종로점' };
const COLORS = [null, ['#FFC533','#171A21'], ['#FF7F32','#171A21'], ['#108A5C','#fff'], ['#2D5BE3','#fff'], ['#E23B3B','#fff'], ['#7A4FD8','#fff'], ['#DB3A82','#fff']];
const FIRST_ADMIN = '김준형';

/* ── 저장소 어댑터 ───────────────────────── */
function localAdapter() {
  const KEY = 'oreurak:docs';
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const write = o => localStorage.setItem(KEY, JSON.stringify(o));
  let dbp;
  const idb = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('oreurak-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => idb().then(d => new Promise((res, rej) => {
    const t = d.transaction('f', mode); const q = fn(t.objectStore('f'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  }));
  return {
    mode: 'local',
    async load() {
      const o = read();
      return Object.keys(o).map(k => { const i = k.indexOf('/'); return { col: k.slice(0, i), id: k.slice(i + 1), data: o[k] }; });
    },
    watch(onRow, onAll) { window.addEventListener('storage', e => { if (e.key === KEY) onAll(); }); },
    async set(col, id, data) { const o = read(); o[col + '/' + id] = data; write(o); },
    async setMany(rows) { const o = read(); rows.forEach(r => { o[r.col + '/' + r.id] = r.data; }); write(o); },
    async remove(col, id) { const o = read(); delete o[col + '/' + id]; write(o); },
    async upload(path, blob) { await tx('readwrite', s => s.put(blob, path)); return path; },
    async url(path) { const b = await tx('readonly', s => s.get(path)); return b ? URL.createObjectURL(b) : ''; },
    async removeMedia(path) { await tx('readwrite', s => s.delete(path)); }
  };
}

function supabaseAdapter(cfg) {
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const bucket = () => sb.storage.from('media');
  const ok = r => { if (r.error) throw r.error; return r.data; };
  return {
    mode: 'remote',
    async load() { return ok(await sb.from('docs').select('col,id,data')); },
    watch(onRow, onAll) {
      let joined = false;
      sb.channel('docs-all').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
        const del = p.eventType === 'DELETE', r = del ? p.old : p.new;
        if (!r || !r.col || !r.id) return onAll();
        onRow({ col: r.col, id: r.id, data: del ? null : r.data });
      }).subscribe(status => { if (status === 'SUBSCRIBED') { if (joined) onAll(); joined = true; } });
    },
    async set(col, id, data) { ok(await sb.from('docs').upsert({ col, id, data, updated_at: new Date().toISOString() })); },
    /* 여러 줄을 한 요청으로 쓴다. 전부 들어가거나 전부 안 들어간다. */

const S = { members: {}, missions: {}, problems: {}, cells: {}, settings: {}, comments: {} };
const app = document.getElementById('app'), sheetEl = document.getElementById('sheet'), fxEl = document.getElementById('fx'), toastEl = document.getElementById('toast');

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const meObj = () => { const m = meId && S.members[meId]; return m ? Object.assign({ id: meId }, m, m.master ? { admin: true } : null) : null; };
const isMaster = () => { const m = meObj(); return !!m && !!m.master; };
/* 빙고판은 그 조 조원과 마스터만 바꿀 수 있다. 운영진도 자기 조 판만 바꾼다. */
const canEdit = t => { const m = meObj(); return !!m && (!!m.master || m.team === t); };
const shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };

let toastTimer;
function toast(msg) {

}

const memberList = () => Object.keys(S.members).map(id => Object.assign({ id }, S.members[id])).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
const teamMembers = t => memberList().filter(m => m.team === t);
const missionList = () => Object.keys(S.missions).map(id => Object.assign({ id }, S.missions[id])).sort((a, b) => a.no - b.no);
/* 채워진 칸만 돌려준다. 예전 방식(룰렛)으로 만들어진 칸은 kind 가 없어서 빠진다. */
function teamCells(t) {
  const a = Array(CELLS).fill(null);
  Object.values(S.cells).forEach(c => { if (c.team === t && KIND[c.kind] && c.done && c.idx >= 0 && c.idx < CELLS) a[c.idx] = c; });
  return a;
}
const doneCount = t => teamCells(t).filter(Boolean).length;
const kindCount = (cells, k, skip) => cells.filter(c => c && c.kind === k && c.idx !== skip).length;
const setting = k => !S.settings.main || S.settings.main[k] !== false;
/* 한 사람이 채울 수 있는 칸 수. 조원이 6명이면 문제 3칸 · 대결 1칸씩이다.
   조원이 적으면 칸이 남으니까 올림한 수(5명이면 4 · 2)까지 풀어 주되, 모두가 내림한 수(3 · 1)는 채우도록
   그보다 더 채우는 사람 수를 남는 칸 수만큼으로 묶는다(5명이면 문제 4칸은 3명, 대결 2칸은 1명). */
function shareOf(t, kind, skip) {
  const mem = teamMembers(t), n = mem.length, q = QUOTA[kind], cnt = {};
  teamCells(t).forEach(c => { if (c && c.kind === kind && c.idx !== skip) (c.by || []).forEach(id => { cnt[id] = (cnt[id] || 0) + 1; }); });
  const on = !!n && setting('perPerson'), lo = on ? Math.floor(q / n) : 0, hi = on ? Math.ceil(q / n) : Infinity;
  const spare = on ? q - lo * n : 0, over = mem.filter(m => (cnt[m.id] || 0) > lo).length;
  return { on, lo, hi, spare, n: id => cnt[id] || 0, max: id => (!on ? Infinity : (cnt[id] || 0) > lo || over < spare ? hi : lo) };
}
const shareTxt = (s, u) => (s.lo === s.hi ? `${s.hi}${u}씩` : s.lo ? `${s.lo}~${s.hi}${u}씩` : `${s.hi}${u}까지`);
function shareErr(sh, who, kind) {
  if (!who || sh.n(who) < sh.max(who)) return '';
  const nm = S.members[who] ? S.members[who].name : '이 조원', u = k => (kind === 'problem' ? `${k}문제` : `대결 ${k}칸`);
  return sh.n(who) >= sh.hi ? `${nm} 님은 이미 ${u(sh.hi)}${kind === 'problem' ? '를' : '을'} 채웠어요.`
    : `${u(sh.hi)}까지 채울 수 있는 조원은 ${sh.spare}명이에요. ${nm} 님은 ${u(sh.lo)}까지 채울 수 있어요.`;
}
/* 이 조가 이미 쓴 대결 미션 */
const duelUsed = (cells, skip) => new Set(cells.filter(c => c && c.kind === 'duel' && c.idx !== skip).map(c => c.missionId));

/* 문제 */
const problemList = () => Object.keys(S.problems).map(id => Object.assign({ id }, S.problems[id])).sort((a, b) => a.sector - b.sector || a.level - b.level || a.hold - b.hold || String(a.note || '').localeCompare(String(b.note || ''), 'ko'));
const lv = k => LEVELS[k] || ['?', '#999'], hd = k => HOLDS[k] || ['?', '#999'];
const probName = p => `${SECTORS[p.sector] || '?'} · ${lv(p.level)[0]} · ${hd(p.hold)[0]} 홀드${p.note ? ' (' + p.note + ')' : ''}`;
const hasProb = c => !!c && c.sector != null && c.level != null && c.hold != null;
const cellProbName = c => (hasProb(c) ? probName(c) : c.title || '문제');
const probKey = c => c.problemId || 't:' + norm(c.title);
const swatch = p => `<span class="sw"><i class="tp" style="background:${lv(p.level)[1]}"></i><i class="hd" style="background:${hd(p.hold)[1]}"></i></span>`;
const dot = col => `<i class="dot" style="background:${col}"></i>`;

/* 빙고 진행 상태: 칸 채우는 시간(fill) → 조 순서대로 문제 부르기(call) → 끝(done) */
const game = () => Object.assign({ phase: 'fill', order: [], turn: 0, calls: [] }, S.settings.game);
const calledSet = k => new Set((game().calls || []).slice(0, k == null ? Infinity : k).map(x => x.p));
/* 대결 칸과 팀 인증샷은 채우자마자 동그라미. 문제 칸은 누군가 그 문제를 불러야 동그라미. */
const isHit = (c, set) => !!c && (c.kind !== 'problem' || (set || calledSet()).has(probKey(c)));
const hitCells = (cells, set) => { set = set || calledSet(); return cells.map(c => (isHit(c, set) ? c : null)); };
/* 빙고 줄은 동그라미 친 칸으로만 센다 */
const wonLines = (cells, set) => { const h = hitCells(cells, set); return LINES.filter(L => L.every(i => h[i])); };
const turnTeam = () => { const g = game(); return g.phase === 'call' && g.order.length ? g.order[g.turn % g.order.length] : 0; };
/* 조가 GOAL_LINES 줄을 완성한 시점(그때까지 부른 문제 수). 아직이면 null. */
function finishAt(cs, calls) {
  calls = calls || game().calls;
  for (let k = 0; k <= calls.length; k++) { if (wonLines(cs, new Set(calls.slice(0, k).map(x => x.p))).length >= GOAL_LINES) return k; }
  return null;
}
/* 빙고가 시작되면 마스터도 판을 바꿀 수 없다(칸을 옮기거나 고치면 부정행위가 된다).
   고칠 일이 생기면 운영진이 칸 채우는 시간으로 되돌린 다음에 고친다. */
const canChange = t => canEdit(t) && game().phase === 'fill';
/* 다른 조의 문제 칸은 빙고가 끝날 때까지 가린다(보고 따라 올리지 못하게). 끝나면 저절로 모두에게 열린다.
   마스터가 직접 켜거나 끌 수도 있는데, 그 선택은 그 단계에서만 통하고 빙고가 시작되거나 끝나면 다시 자동으로 돌아간다. */
const boardsOpen = () => { const o = (S.settings.main || {}).reveal, ph = game().phase; return o && o.ph === ph ? !!o.on : ph === 'done'; };
/* 우리 조와 마스터는 항상 보고, 이미 동그라미가 쳐진 문제는 모두에게 알려진 것이라 보여 준다. 운영진도 다른 조 것은 못 본다. */
const hiddenFor = c => { const m = meObj(); return !!c && c.kind === 'problem' && !boardsOpen() && !(m && (m.master || m.team === c.team)) && !isHit(c); };
const veilMsg = () => (game().phase === 'done' ? '지금은 다른 조의 문제 칸을 볼 수 없어요.' : '다른 조의 문제 칸은 빙고가 끝난 뒤에 볼 수 있어요.');
/* 댓글은 칸 자리가 바뀌어도 따라가도록 자리 번호가 아니라 칸마다 고유한 값에 붙인다. */
const cellKey = c => c.cid || c.team + ':' + (c.doneAt || 0);
const commentsOf = c => { const k = cellKey(c); return Object.keys(S.comments).map(id => Object.assign({ id }, S.comments[id])).filter(x => x.k === k).sort((a, b) => a.at - b.at); };
function dropComments(pred) {
  Object.keys(S.comments).filter(id => pred(S.comments[id])).forEach(id => { epoch++; delete S.comments[id]; adapter.remove('comments', id).catch(() => {}); });
}

async function resync(force) {
  const at = epoch;
  const rows = await adapter.load();
  if ((at !== epoch || swapPending) && !force) return;   /* 저장을 기다리는 자리 바꾸기가 있으면 화면을 서버 상태로 되돌리지 않는다 */
  const n = { members: {}, missions: {}, problems: {}, cells: {}, settings: {}, comments: {} };
  rows.forEach(r => { if (n[r.col]) n[r.col][r.id] = r.data; });
  Object.assign(S, n);
}
async function put(col, id, data, quiet) {

function loadScript(src) {

}

async function boot() {
  failed = false; ready = false; render();
  const timer = setTimeout(() => { if (!ready) { failed = true; render(); } }, 10000);
  try {
    if (!adapter) {
      if (CONFIG.supabaseUrl && CONFIG.supabaseKey) {
        await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
        adapter = supabaseAdapter(CONFIG);
      } else adapter = localAdapter();
      /* 바뀐 한 줄만 받아서 반영한다. 전체 다시 읽기는 재접속·화면 복귀 때와 2분마다 한 번만. */
      let pending, paint;
      const full = () => { clearTimeout(pending); pending = setTimeout(() => resync().then(render).catch(() => {}), 150); };
      adapter.watch(row => {
        if (!ready || !S[row.col]) return;
        if (row.col === 'cells' && row.data && row.data.sw && staleStamps.has(row.data.sw)) return;   /* 내가 이미 다시 옮긴 칸의 늦은 메아리 */
        epoch++;
        if (row.data === null) delete S[row.col][row.id]; else S[row.col][row.id] = row.data;
        clearTimeout(paint); paint = setTimeout(render, 80);
      }, full);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && ready) full(); });
      setInterval(() => { if (!document.hidden && ready && adapter.mode === 'remote') full(); }, 120000);
    }
    await resync(true);
    await seedIfEmpty();
    try { meId = localStorage.getItem('oreurak:me'); } catch (e) {}
    ready = true; failed = false;
  } catch (e) { console.error(e); failed = true; }
  clearTimeout(timer); render();
}

function route() {

  if ((m = h.match(/^team-(\d)$/)) && +m[1] >= 1 && +m[1] <= TEAMS) return { v: 'team', t: +m[1] };
  if ((m = h.match(/^cell-(\d)-(\d+)$/)) && +m[1] >= 1 && +m[1] <= TEAMS && +m[2] < CELLS) return { v: 'cell', t: +m[1], i: +m[2] };
  if (h === 'me') return { v: 'me' };
  if (h === 'raffle') return { v: 'raffle' };
  if (h === 'admin' && meObj().admin) return { v: 'admin' };
  if (h === 'master' && isMaster()) return { v: 'master' };
  if (h === 'live') return { v: 'live' };
  return { v: 'home' };
}

function teamStat(t) {
  const cs = teamCells(t), f = cs.filter(Boolean), calls = game().calls || [];
  const lines = wonLines(cs).length;
  let reach = 0;
  if (lines) for (; reach < calls.length; reach++) { if (wonLines(cs, calledSet(reach)).length >= lines) break; }
  return { t, lines, reach, fin: finishAt(cs), hits: hitCells(cs).filter(Boolean).length, n: f.length, last: f.reduce((a, c) => Math.max(a, c.doneAt || 0), 0) };
}
/* 6줄을 먼저 완성한 조가 위. 같은 문제로 동시에 완성하면 공동 순위.
   아직 완성 못 한 조는 줄 수 → 그 줄 수에 먼저 도달 → 동그라미 → 채운 칸 순서. */
function ranking() {
  const rows = [];
  for (let t = 1; t <= TEAMS; t++) rows.push(teamStat(t));
  /* 동시에 완성한 조끼리는 운영진이 정한 순서(g.tb)가 있으면 그 순서, 없으면 공동 순위 */
  const tb = game().tb || {}, tbv = r => (tb[r.t] == null ? 99 : tb[r.t]);
  rows.sort((a, b) => (a.fin == null) - (b.fin == null) || (a.fin != null ? a.fin - b.fin || tbv(a) - tbv(b) : 0) || b.lines - a.lines || a.reach - b.reach || b.hits - a.hits || b.n - a.n || a.last - b.last || a.t - b.t);
  rows.forEach((r, i) => { const p = rows[i - 1]; r.pos = p && p.fin != null && p.fin === r.fin && tbv(p) === tbv(r) ? p.pos : i + 1; r.rank = r.n ? r.pos : 0; });
  return rows;
}

/* 사진만 다룬다. 빙고판에는 작은 미리보기를, 상세에는 원본을 보여 준다. */

}
function hydrate(root) {
  const get = async p => urlCache[p] || (urlCache[p] = await adapter.url(p));
  root.querySelectorAll('[data-m]:not([src])').forEach(async el => { try { const u = await get(el.dataset.m); if (u && el.isConnected) el.src = u; } catch (e) {} });
}
const usedBytes = () => Object.values(S.cells).reduce((a, c) => a + (c.media || []).reduce((x, m) => x + (m.s || 0), 0), 0)
  + Object.values(S.missions).reduce((a, m) => a + (m.img && m.img.s || 0), 0);

/* 미션 사진. 미션이 남아 있으면 지금 사진을, 미션이 지워졌으면 뽑을 때 칸에 붙여 둔 사진을 쓴다. */

const lazyImg = (p, alt) => { const u = urlCache[p] || ''; return `<img data-m="${esc(p)}"${u ? ` src="${esc(u)}"` : ''} alt="${alt || ''}">`; };
function picTag(img) {
  return img ? `<button type="button" class="mpic" data-act="zoom" data-p="${esc(img.p)}" aria-label="미션 사진 크게 보기">${lazyImg(img.p, '미션 사진')}<span>눌러서 크게</span></button>` : '';
}
function qthumb(m, zoom) {
  if (!m.img) return '';
  const im = lazyImg(m.img.th || m.img.p);
  return zoom ? `<button type="button" class="qth" data-act="zoom" data-p="${esc(m.img.p)}" aria-label="미션 사진 크게 보기">${im}</button>` : `<span class="qth">${im}</span>`;
}
function openZoom(p) {

/* 칸에 붙여 둔 사진으로 아직 쓰이고 있으면 파일은 남겨 둔다. */

const cellName = i => (i === CENTER ? '가운데 칸' : (i + 1) + '번 칸');
/* 동그라미 모양: 한 바퀴를 조금 넘겨 끝이 겹치고, 굵기가 가늘게 시작해서 굵어졌다가 다시 가늘어지는 붓 자국 */
const RING_D = (() => {
  const n = 30, pts = [], c = Math.cos(-0.26), s = Math.sin(-0.26);
  const at = (p, side) => {
    const a = -2.25 + 7.15 * p, grow = 1 + 0.11 * p;
    const w = 0.5 + 3.7 * Math.pow(Math.sin(Math.PI * Math.min(1, p * 1.07)), 0.7);
    const x = Math.cos(a) * (38 * grow + side * w), y = Math.sin(a) * (32.5 * grow + side * w);
    return (50 + x * c - y * s).toFixed(1) + ' ' + (50 + x * s + y * c).toFixed(1);
  };
  for (let k = 0; k <= n; k++) pts.push(at(k / n, 1));
  for (let k = n; k >= 0; k--) pts.push(at(k / n, -1));
  return 'M' + pts.join('L') + 'Z';
})();
const ringSVG = k => `<svg class="ring v${k % 4}" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${RING_D}"/></svg>`;
function cellHTML(t, i, c, can, inLine, callOn) {

  if (hiddenFor(c)) {
    const vm = c.media && c.media[0];
    return `<button class="cell done k-problem veil" data-act="veiled" data-t="${t}" data-i="${i}" aria-label="${cellName(i)} 문제 칸, 빙고가 끝나면 볼 수 있어요">${vm ? mediaTag(vm, true) : ''}<span class="pb">문제</span></button>`;
  }
  const m = c.media && c.media[0], pop = popCell === t + '-' + i ? ' pop' : '', hit = isHit(c), prob = c.kind === 'problem';
  const text = c.kind === 'duel' ? c.mTitle : prob ? (hasProb(c) ? `${lv(c.level)[0]}·${hd(c.hold)[0]}` : c.title) : c.title;
  const inner = (m ? mediaTag(m, true) : `<span class="ct">${esc(text)}</span>`)

  const cls = `cell done k-${c.kind}${hit ? ' hit' : ''}${inLine ? ' line' : ''}${pop}`, label = `${cellName(i)} ${KIND[c.kind]}: ${esc(prob ? cellProbName(c) : text)}${hit ? ', 동그라미' : ''}`;
  if (callOn && prob && !hit) return `<button class="${cls} callable" data-act="call" data-t="${t}" data-i="${i}" aria-label="${label}, 눌러서 동그라미 치기">${inner}</button>`;
  return `<a class="${cls}" href="#cell-${t}-${i}" data-t="${t}" data-i="${i}" draggable="false" aria-label="${label}">${inner}</a>`;

    <button class="btn quiet" data-act="mlist" data-t="${t}">팀 대결 미션 목록 보기</button></div>`;

/* ── 전체 빙고판 ─────────────────────────

function liveCell(c, i, hit, inLine) {
  if (!c) return '<i class="lc"></i>';
  const cls = `lc f${inLine ? ' line' : ''}`, ring = hit ? ringSVG(i) : '';
  if (c.kind === 'problem') return `<i class="${cls}">${ring}</i>`;
  return `<i class="${cls} k">${c.kind === 'duel' ? '대결' : '팀'}${ring}</i>`;
}
function liveView() {
  const g = game(), rk = ranking(), tt = turnTeam(), set = calledSet();
  let h = topbar() + `<a class="back" href="#">‹ 전체 조</a>${gameBanner()}
    <p class="hint">${g.phase === 'fill' ? '지금은 칸 채우는 시간이에요. ' : ''}모든 조의 빙고판이 바뀌는 대로 바로 보여요. 흰 칸은 채운 문제 칸이고, 동그라미가 쳐진 칸만 빙고 줄로 쳐요. 조를 누르면 그 조 빙고판이 열려요.</p><div class="live">`;
  for (let t = 1; t <= TEAMS; t++) {
    const cs = teamCells(t), won = wonLines(cs, set), hot = new Set([].concat(...won)), r = rk.find(x => x.t === t);
    const state = r.fin != null ? `${rk.filter(x => x.pos === r.pos).length > 1 ? '공동 ' : ''}${r.pos}등` : tt === t ? '차례' : '';
    h += `<a class="lcard tc${t}${tt === t ? ' turn' : ''}" href="#team-${t}"><span class="lhead"><span class="tape">${t}조</span><b>${won.length}줄</b>${state ? `<em>${state}</em>` : ''}</span>
      <span class="lgrid">${cs.map((c, i) => liveCell(c, i, isHit(c, set), hot.has(i))).join('')}</span>
      <span class="lfoot">동그라미 ${hitCells(cs, set).filter(Boolean).length} · 채운 칸 ${cs.filter(Boolean).length}/${CELLS}</span></a>`;
  }
  h += `</div>`;
  if (g.calls.length) h += `<div class="group"><div class="group-h"><b>동그라미 친 문제 ${g.calls.length}개</b><span>최근 순</span></div>${g.calls.slice().reverse().slice(0, 10).map((c, k) => `<div class="prow"><b>${g.calls.length - k}. ${esc(c.name)}</b><span>${c.t}조</span></div>`).join('')}</div>`;

/* ── 비밀번호 ─────────────────────────
   처음에는 모두 0000. 바꾸면 해시만 저장한다. 다만 누구나 읽을 수 있는 저장소라 안전한 보관은 아니다. */
async function pwHash(id, pw) {
  const text = 'oreurak:' + id + ':' + pw;
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h1 = 0x811c9dc5, h2 = 0x1b873593;   /* https 가 아닌 곳에서만 쓰는 대체 계산 */
  for (let i = 0; i < text.length; i++) { h1 = Math.imul(h1 ^ text.charCodeAt(i), 16777619); h2 = Math.imul(h2 + text.charCodeAt(i), 2246822519) ^ (h2 >>> 13); }
  return 'f' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}
async function pwOk(m, pw) { return m.pwh ? (await pwHash(m.id, pw)) === m.pwh : pw === PASSWORD; }
function openPw() {
  const m = meObj();

    <div class="field"><label for="pw-new">새 비밀번호</label><input class="inp" id="pw-new" type="password" inputmode="numeric" maxlength="8" placeholder="숫자 4~8자리"></div>
    <div class="field"><label for="pw-new2">새 비밀번호 한 번 더</label><input class="inp" id="pw-new2" type="password" inputmode="numeric" maxlength="8" placeholder="숫자 4~8자리"></div>
    <p class="hint">다른 곳에서 쓰는 비밀번호는 넣지 마세요. 이 행사에서만 쓸 번호로 정해주세요. 잊어버리면 운영진이 0000으로 되돌려줄 수 있어요.</p>
    <p class="err" id="pw-err" hidden></p>

}
async function savePw() {
  const m = meObj(), err = document.getElementById('pw-err'); if (!m || !err) return;

  err.hidden = true;

}

const usedNums = () => { const s = new Set(), r = raffle(); Object.values(r && r.tickets || {}).forEach(a => a.forEach(n => s.add(n))); return s; };
const freeNums = () => { const u = usedNums(), a = []; for (let n = 1; n <= DRAW_MAX; n++) if (!u.has(n)) a.push(n); return a; };
/* 마스터만 쓰는 추첨권 버튼들. 추첨권 화면과 마스터 페이지에 똑같이 나온다. */

      <button class="btn" data-act="rf-draw"${done && !tied ? '' : ' disabled'}>${r ? '번호 다시 뽑기' : '번호 뽑기'}</button></div>

      ${exList.length ? `<div class="exlist">${exList.map(n => `<span><i class="num x">${n}</i>${esc((S.members[ex[n]] || {}).name || '지워진 참가자')}<button data-act="rf-xdel" data-id="${n}" aria-label="${n}번 빼기">×</button></span>`).join('')}</div>` : ''}
      <button class="btn ghost" data-act="rf-xadd"${exList.length > EXTRA_TO - EXTRA_FROM ? ' disabled' : ''}>번호 직접 주기</button></div>

      <button class="btn danger" data-act="rf-wipe"${r || exList.length ? '' : ' disabled'}>추첨권 전체 회수</button></div>`;

/* 지금 순위로 번호를 나눠 준다. 1~84번 중에서 무작위로 쓰고, 공동 순위로 모자라면 101번부터 이어 쓴다(85~100번은 따로 주는 몫).
   조에 직접 나눠 준 번호가 있어도 모두 새로 바뀐다. */
async function drawRaffle() {
  if (!isMaster()) return;
  if (game().phase !== 'done') return toast('빙고가 끝난 뒤에 뽑을 수 있어요.');
  if (tieGroups().length) return toast('공동 순위를 먼저 정해주세요.');
  const ranks = {}, per = {}, need = [];
  ranking().forEach(r => { ranks[r.t] = r.pos; per[r.t] = ticketsFor(r.pos); teamMembers(r.t).forEach(x => { for (let k = 0; k < per[r.t]; k++) need.push(x.id); }); });
  if (!need.length) return toast('번호를 받을 조원이 없어요.');
  const pool = [];
  for (let n = 1; pool.length < Math.max(need.length, DRAW_MAX); n++) { if (n >= EXTRA_FROM && n <= EXTRA_TO) continue; pool.push(n); }
  for (let k = pool.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [pool[k], pool[j]] = [pool[j], pool[k]]; }
  const tickets = {};
  need.forEach((id, k) => { (tickets[id] = tickets[id] || []).push(pool[k]); });
  Object.values(tickets).forEach(a => a.sort((p, q) => p - q));
  if (await put('settings', 'raffle', { at: Date.now(), ranks, per, tickets, total: need.length, over: need.length > DRAW_MAX })) toast(`번호 ${need.length}장을 나눠 줬어요.`);
}
/* 한 조의 모든 조원에게 같은 장수만큼 나눠 준다. 순위대로 뽑기가 잘못됐을 때 마스터가 손으로 주는 길이다. */
let gf = null;
function drawGive() {
  const info = document.getElementById('gf-info'), take = document.getElementById('gf-take'); if (!info || !gf) return;
  const mem = teamMembers(gf.t), tk = raffle() && raffle().tickets || {}, have = mem.reduce((a, x) => a + (tk[x.id] || []).length, 0);
  info.textContent = `${gf.t}조 ${mem.length}명 × ${gf.n}장 = ${mem.length * gf.n}장을 줘요. 남은 번호는 ${freeNums().length}장이고, ${gf.t}조가 지금 가진 번호는 ${have}장이에요.`;
  if (take) take.disabled = !have;
}

    <div class="field"><span class="label">조</span><div class="seg">${Array.from({ length: TEAMS }, (_, k) => `<button type="button" class="tc${k + 1}" data-act="gf-t" data-v="${k + 1}" aria-pressed="${k === 0}">${k + 1}조</button>`).join('')}</div></div>
    <div class="field"><span class="label">한 사람당 몇 장</span><div class="chips">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="chip" data-act="gf-n" data-v="${n}" aria-pressed="${n === 1}">${n}장</button>`).join('')}</div></div>
    <p class="hint" id="gf-info"></p>
    <p class="err" id="gf-err" hidden></p>
    <button class="btn" type="submit">번호 주기</button>
    <button class="btn danger" type="button" id="gf-take" data-act="gf-take">이 조 번호만 회수</button>
    <button class="btn quiet" type="button" data-act="sheet-close">취소</button></form>`);
  drawGive();
}
async function saveGive() {
  const err = document.getElementById('gf-err'); if (!gf || !err || !isMaster()) return;
  const t = gf.t, n = gf.n, mem = teamMembers(t), free = shuffle(freeNums());
  err.hidden = true;
  if (!mem.length) return showErr(err, `${t}조에 조원이 없어요.`);
  if (free.length < mem.length * n) return showErr(err, `남은 번호가 ${free.length}장이라 ${mem.length * n}장을 줄 수 없어요.`);
  const r = raffle() || {}, tickets = Object.assign({}, r.tickets);
  mem.forEach((x, k) => { tickets[x.id] = (tickets[x.id] || []).concat(free.slice(k * n, (k + 1) * n)).sort((p, q) => p - q); });
  gf = null; closeSheet();
  const data = Object.assign({ ranks: {}, per: {} }, r, { at: Date.now(), tickets, hand: Object.assign({}, r.hand, { [t]: ((r.hand || {})[t] || 0) + n }) });
  if (await put('settings', 'raffle', data)) toast(`${t}조 ${mem.length}명에게 ${n}장씩 줬어요.`);
}
async function takeTeam() {
  const r = raffle(); if (!gf || !r || !isMaster()) return;
  const t = gf.t, n = Object.assign({}, r, { tickets: Object.assign({}, r.tickets), ranks: Object.assign({}, r.ranks), per: Object.assign({}, r.per), hand: Object.assign({}, r.hand) });
  let cnt = 0;
  teamMembers(t).forEach(x => { cnt += (n.tickets[x.id] || []).length; delete n.tickets[x.id]; });
  delete n.ranks[t]; delete n.per[t]; delete n.hand[t];
  gf = null; closeSheet();
  if (Object.keys(n.tickets).length ? await put('settings', 'raffle', n) : await del('settings', 'raffle')) toast(`${t}조 번호 ${cnt}장을 회수했어요.`);
}

  err.hidden = true;

}

/* ── 빙고 진행 ───────────────────────── */
/* from 번째 조부터 돌면서, 아직 안 불린 문제 칸을 가진 조의 차례 번호를 찾는다. 없으면 -1. */
function nextTurn(g, from) {
  const n = g.order.length, set = new Set(g.calls.map(x => x.p));
  for (let k = 0; k < n; k++) {
    const idx = ((from % n) + n + k) % n, cs = teamCells(g.order[idx]);
    /* 이미 6줄을 완성한 조와 부를 문제가 없는 조는 건너뛴다 */
    if (finishAt(cs, g.calls) == null && cs.some(c => c && c.kind === 'problem' && !set.has(probKey(c)))) return idx;
  }
  return -1;
}
let go = null;
const goRows = () => go.order.map((t, k) => `<div class="orow tc${t}"><i>${k + 1}</i><span class="tape">${t}조</span><span class="om">문제 칸 ${kindCount(teamCells(t), 'problem')}개</span><button type="button" data-act="go-move" data-k="${k}" data-d="-1" aria-label="${t}조 위로"${k ? '' : ' disabled'}>▲</button><button type="button" data-act="go-move" data-k="${k}" data-d="1" aria-label="${t}조 아래로"${k < go.order.length - 1 ? '' : ' disabled'}>▼</button></div>`).join('');
function openStart() {
  if (!isMaster()) return toast('빙고 시작은 마스터만 할 수 있어요.');
  const g = game();
  go = { order: g.order.length === TEAMS ? g.order.slice() : Array.from({ length: TEAMS }, (_, k) => k + 1) };
  openSheet(`<div style="display:flex;flex-direction:column;gap:14px">
    <h2>빙고 시작</h2><p class="sheet-sub" style="margin-top:-6px">동그라미를 칠 조 순서를 정해주세요. 시작하면 마스터를 포함해 아무도 칸을 채우거나 옮기거나 고칠 수 없어요.</p>
    <div class="group" id="go-list">${goRows()}</div>
    <button class="btn ghost" data-act="go-shuffle">무작위로 섞기</button>
    <button class="btn" data-act="go-start">이 순서로 빙고 시작</button>
    <button class="btn quiet" data-act="sheet-close">취소</button></div>`);
}
function drawStart() { const box = document.getElementById('go-list'); if (box && go) box.innerHTML = goRows(); }
async function startGame() {
  if (!go || !isMaster()) return;
  const g = { phase: 'call', order: go.order.slice(), turn: 0, calls: [], startedAt: Date.now() };
  const k = nextTurn(g, 0);
  if (k < 0) return toast('동그라미 칠 문제 칸이 하나도 없어요. 조들이 문제 칸을 먼저 채워야 해요.');
  g.turn = k; go = null; closeSheet();
  if (await put('settings', 'game', g)) toast(`빙고를 시작했어요. ${g.order[k]}조부터예요.`);
}
async function callProblem(t, i) {
  const g = game(), c = teamCells(t)[i];
  if (g.phase !== 'call' || turnTeam() !== t || !canEdit(t) || !c || c.kind !== 'problem' || isHit(c)) return toast('지금은 이 칸에 동그라미를 칠 수 없어요.');
  const n = Object.assign({}, g, { calls: g.calls.concat({ p: probKey(c), t, at: Date.now(), name: cellProbName(c) }) });
  const k = nextTurn(n, g.turn + 1);
  if (k < 0) n.phase = 'done'; else n.turn = k;
  await put('settings', 'game', n);
}
async function gameAct(act) {
  if (!meObj() || !meObj().admin) return;
  const g = game(), n = Object.assign({}, g, { calls: g.calls.slice() });
  if (act === 'skip') { const k = nextTurn(n, g.turn + 1); if (k < 0) return toast('넘길 조가 없어요.'); n.turn = k; }
  else if (act === 'undo') { const last = n.calls.pop(); if (!last) return; const k = n.order.indexOf(last.t); n.turn = k < 0 ? g.turn : k; n.phase = 'call'; delete n.tb; }
  else if (act === 'end') n.phase = 'done';
  else if (act === 'resume') { const k = nextTurn(n, g.turn); if (k < 0) return toast('더 동그라미 칠 문제 칸이 없어요.'); n.turn = k; n.phase = 'call'; }
  else if (act === 'reset') { n.phase = 'fill'; n.calls = []; n.turn = 0; delete n.tb; }
  await put('settings', 'game', n);
}
/* 내 조에 빙고 줄이 새로 생기거나 누가 문제를 부르면 알려 준다. 화면을 그릴 때마다 지난번과 비교한다. */
/* ── 공동 순위 정하기 (운영진) ─────────────────────────
   동시에 6줄을 완성한 조는 공동 순위가 된다. 현장에서 대결로 순서를 정한 뒤 운영진이 여기서 넣는다. */
function tieGroups() {
  const by = {};
  ranking().forEach(r => { (by[r.pos] = by[r.pos] || []).push(r.t); });
  return Object.keys(by).map(Number).sort((a, b) => a - b).filter(p => by[p].length > 1).map(p => ({ pos: p, teams: by[p] }));
}
function tieCard() {
  const groups = tieGroups(), decided = Object.keys(game().tb || {}).length;
  if (!groups.length && !decided) return '';
  return `<div class="setting gctl"><span class="label">${groups.length ? '공동 순위가 있어요' : '공동 순위를 모두 정했어요'}<small>${groups.length ? '현장에서 대결로 순서를 정한 뒤 여기서 넣어주세요. 정하기 전에는 추첨권 번호를 뽑을 수 없어요.' : '정한 순서대로 순위가 매겨졌어요.'}</small></span>
    ${groups.map(gp => `<button class="btn" data-act="tb-open" data-id="${gp.pos}">공동 ${gp.pos}등 순서 정하기 · ${gp.teams.map(t => t + '조').join(', ')}</button>`).join('')}
    ${decided ? '<button class="btn ghost" data-act="tb-clear">정한 순서 지우고 공동 순위로 되돌리기</button>' : ''}</div>`;
}
let tf = null;
const tieRows = () => tf.order.map((t, k) => `<div class="orow tc${t}"><i>${tf.pos + k}</i><span class="tape">${t}조</span><span class="om">${tf.pos + k}등</span><button type="button" data-act="tb-move" data-k="${k}" data-d="-1" aria-label="${t}조 위로"${k ? '' : ' disabled'}>▲</button><button type="button" data-act="tb-move" data-k="${k}" data-d="1" aria-label="${t}조 아래로"${k < tf.order.length - 1 ? '' : ' disabled'}>▼</button></div>`).join('');
function openTie(pos) {
  const gp = tieGroups().find(x => x.pos === pos);
  if (!gp || !meObj().admin) return;
  tf = { pos, order: gp.teams.slice() };
  openSheet(`<div style="display:flex;flex-direction:column;gap:14px">
    <h2>공동 ${pos}등 순서 정하기</h2><p class="sheet-sub" style="margin-top:-6px">대결 결과대로 위에서부터 놓아주세요. 맨 위가 ${pos}등이에요.</p>
    <div class="group" id="tb-list">${tieRows()}</div>
    <button class="btn" data-act="tb-save">이 순서로 정하기</button>
    <button class="btn quiet" data-act="sheet-close">취소</button></div>`);
}
async function saveTie() {
  const m = meObj(); if (!tf || !m || !m.admin) return;
  const g = game(), tb = Object.assign({}, g.tb);
  tf.order.forEach((t, k) => { tb[t] = k; });
  const txt = tf.order.map((t, k) => `${tf.pos + k}등 ${t}조`).join(', ');

async function shrink(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/gif') return file;
  try {
    const bmp = await createImageBitmap(file), s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
    return b && b.size < file.size ? b : file;
  } catch (e) { return file; }
}

}

  const stop = msg => { pf.busy = false; sheetLock = false; btn.disabled = false; btn.textContent = pf.edit ? '수정 저장' : '칸 채우기'; showErr(err, msg); };
  /* 1) 올리기 전에 사진을 줄인다. 다시 눌렀을 때 또 줄이지 않게 결과를 붙여 둔다. */
  const fresh = pf.media.filter(m => m.file);
  for (const m of fresh) if (!m.blob) m.blob = await shrink(m.file);
  if (fresh.length && usedBytes() + fresh.reduce((a, m) => a + m.blob.size, 0) > STORAGE_BUDGET_MB * 1048576) return stop('저장 공간이 거의 찼어요. 운영진에게 알려주세요.');
  /* 2) 올리기 */
  const media = []; let k = 0;
  try {
    for (const m of pf.media) {
      if (m.p) { const keep = { p: m.p, t: m.t }; if (m.th) keep.th = m.th; if (m.s) keep.s = m.s; media.push(keep); continue; }
      btn.textContent = `올리는 중 ${++k} / ${fresh.length}`;
      const blob = m.blob, stem = `${id}/${Date.now().toString(36)}-${uid('')}`;
      const path = `${stem}.${extOf(blob)}`;
      await adapter.upload(path, blob);
      const item = { p: path, t: m.t, s: blob.size };
      const th = await makeThumb(m.file);
      if (th) { try { await adapter.upload(`${stem}-t.jpg`, th); item.th = `${stem}-t.jpg`; item.s += th.size; } catch (e) {} }
      media.push(item);
    }
  } catch (e) {
    console.error(e);
    return stop('파일을 올리지 못했어요. 연결 상태를 확인하고 다시 눌러주세요.');
  }
  /* 3) 칸 저장. 그 사이 다른 조원이 같은 칸을 채웠으면 덮어쓰지 않는다. */
  if (!pf.edit && teamCells(t)[i]) { media.forEach(rmFiles); pf = null; closeSheet(); return toast('다른 조원이 방금 이 칸을 채웠어요.'); }
  const old = S.cells[id], edit = pf.edit;
  popCell = id;
  const saved = await put('cells', id, Object.assign({ team: t, idx: i, kind, done: true, title, desc, by: [...pf.by], media, doneAt: c ? c.doneAt || Date.now() : Date.now(), doneBy: c ? c.doneBy || meId : meId, cid: c ? cellKey(c) : uid('c-') }, extra));
  (old && old.media || []).filter(o => !media.some(n => n.p === o.p)).forEach(rmFiles);
  pf = null; closeSheet();
  if (saved) toast(edit ? '수정했어요.' : kind === 'problem' ? '칸을 채웠어요. 빙고가 시작되고 이 문제가 불리면 동그라미가 쳐져요.' : '칸을 채웠어요.');
}

function confetti(cv) {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const d = Math.min(2, devicePixelRatio || 1), W = cv.width = innerWidth * d, H = cv.height = innerHeight * d, x = cv.getContext('2d');
  const P = Array.from({ length: 110 }, () => ({ x: Math.random() * W, y: -Math.random() * H * 0.9, w: (14 + Math.random() * 16) * d, h: (5 + Math.random() * 4) * d, vy: (2.2 + Math.random() * 3.2) * d, vx: (Math.random() - 0.5) * 1.6 * d, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.22, c: COLORS[1 + Math.floor(Math.random() * 7)][0] }));
  const t0 = performance.now();
  (function tick(now) {
    if (!cv.isConnected) return;
    x.clearRect(0, 0, W, H);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (now - t0 < 5200) requestAnimationFrame(tick); else x.clearRect(0, 0, W, H);
  })(t0);
}

/* 두 번 눌러야 실행되는 버튼. 다른 사람의 변경으로 화면이 다시 그려져도 첫 번째 누름을 기억한다. */
let armedState = null;
const armKey = el => [el.dataset.act, el.dataset.t || '', el.dataset.i || '', el.dataset.id || ''].join('|');
function armed(btn, label) {
  const key = armKey(btn);
  if (armedState && armedState.key === key && Date.now() < armedState.until) { armedState = null; showArmed(); return true; }
  armedState = { key, label, until: Date.now() + 3500 };
  showArmed();
  setTimeout(() => { if (armedState && Date.now() >= armedState.until) { armedState = null; showArmed(); } }, 3600);
  return false;
}
function showArmed() {
  document.querySelectorAll('[data-armed]').forEach(b => { if (!armedState || armKey(b) !== armedState.key) { b.textContent = b.dataset.orig; b.classList.remove('armed'); delete b.dataset.armed; } });
  if (!armedState) return;
  document.querySelectorAll('[data-act]').forEach(b => { if (!b.dataset.armed && armKey(b) === armedState.key) { b.dataset.armed = '1'; b.dataset.orig = b.textContent; b.textContent = armedState.label; b.classList.add('armed'); } });
}
function rmFiles(m) { [m.p, m.th].filter(Boolean).forEach(p => adapter.removeMedia(p).catch(() => {})); }
function dropMedia(c) { (c && c.media || []).forEach(rmFiles); }

/* ── 이벤트 ───────────────────────── */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;

    case 'logout': meId = null; try { localStorage.removeItem('oreurak:me'); } catch (x) {} location.hash = ''; render(); break;
    case 'sheet-close': if (!sheetLock) { closeSheet(); pf = null; qf = null; go = null; prf = null; xf = null; gf = null; tf = null; cf = null; } break;
    case 'fx-close': closeFx(); break;

    case 'proof': openProof(t, i); break;

      { const was = pf.by.has(d.id); pf.by.clear(); if (!was) pf.by.add(d.id); }

    }
    case 'pf-mission': if (pf && !pf.busy) { pf.mission = d.id; el.parentElement.querySelectorAll('.qrow').forEach(b => b.setAttribute('aria-pressed', b === el)); } break;
    case 'pf-vs': if (pf && !pf.busy) { pf.vs = +d.v; el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); } break;
    case 'pf-rm': if (pf && !pf.busy) { pf.media.splice(+d.k, 1); drawProofMedia(); } break;
    case 'clearcell': if (canChange(t) && armed(el, '한 번 더 누르면 칸이 비워져요')) { const old = S.cells[t + '-' + i]; dropMedia(old); if (old) { const k = cellKey(old); dropComments(x => x.k === k); } await del('cells', t + '-' + i); location.hash = 'team-' + t; toast('칸을 비웠어요.'); } break;
    case 'call': openCall(t, i); break;
    case 'call-go': closeSheet(); await callProblem(t, i); break;
    case 'pf-sector': if (pf && !pf.busy) { pf.sector = +d.v; pf.level = null; pf.problem = ''; drawProblemPick(); } break;
    case 'pf-level': if (pf && !pf.busy) {
      pf.level = +d.v; pf.problem = ''; drawProblemPick();
      const only = document.querySelectorAll('#pf-prob [data-act="pf-prob"]');
      if (only.length === 1) { pf.problem = only[0].dataset.id; drawProblemPick(); }   /* 하나뿐이면 바로 고른다 */
    } break;
    case 'pf-prob': if (pf && !pf.busy) { pf.problem = d.id; drawProblemPick(); } break;
    case 'pr-edit': openProblem(d.id); break;
    case 'pr-del': if (armed(el, '한 번 더 누르면 삭제돼요')) { closeSheet(); prf = null; if (await del('problems', d.id)) toast('삭제했어요. 이미 올린 칸은 그대로예요.'); } break;

    case 'g-start': openStart(); break;
    case 'go-move': if (go) { const k = +d.k, j = k + (+d.d), o = go.order; if (j >= 0 && j < o.length) { [o[k], o[j]] = [o[j], o[k]]; drawStart(); } } break;
    case 'go-shuffle': if (go) { const o = go.order; for (let k = o.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [o[k], o[j]] = [o[j], o[k]]; } drawStart(); } break;
    case 'go-start': await startGame(); break;
    case 'g-skip': await gameAct('skip'); break;
    case 'g-resume': await gameAct('resume'); break;
    case 'g-undo': if (armed(el, '한 번 더 누르면 취소돼요')) await gameAct('undo'); break;
    case 'g-end': if (armed(el, '한 번 더 누르면 빙고가 끝나요')) await gameAct('end'); break;
    case 'g-reset': if (armed(el, '한 번 더 누르면 문제 칸 동그라미가 모두 지워져요')) await gameAct('reset'); break;
    case 'pw-open': openPw(); break;
    case 'm-pw': { const mm = S.members[d.id]; if (mm) { const c = Object.assign({}, mm); delete c.pwh; closeSheet(); if (await put('members', d.id, c)) toast('비밀번호를 0000으로 되돌렸어요.'); } break; }
    case 'rf-draw': if (!raffle() || armed(el, '한 번 더 누르면 번호가 새로 바뀌어요')) await drawRaffle(); break;
    case 'rf-wipe': if (isMaster() && armed(el, '한 번 더 누르면 모든 번호가 지워져요')) { let ok = true; if (raffle()) ok = await del('settings', 'raffle'); if (ok && Object.keys(extraMap()).length) ok = await del('settings', 'extra'); if (ok) toast('추첨권을 모두 회수했어요.'); } break;
    case 'rf-give': openGive(); break;
    case 'gf-t': case 'gf-n': if (gf) { gf[d.act === 'gf-t' ? 't' : 'n'] = +d.v; el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); armedState = null; showArmed(); drawGive(); } break;
    case 'gf-take': if (gf && armed(el, `한 번 더 누르면 ${gf.t}조 번호가 지워져요`)) await takeTeam(); break;
    case 'reveal': if (isMaster()) { const cur = S.settings.main || {}; await put('settings', 'main', Object.assign({}, cur, { reveal: { on: !boardsOpen(), ph: game().phase } })); } break;
    case 'rf-xadd': if (isMaster()) openExtra(); break;
    case 'rf-xdel': if (isMaster()) { const ex = Object.assign({}, extraMap()); delete ex[d.id]; if (await put('settings', 'extra', ex)) toast(`${d.id}번을 뺐어요.`); } break;
    case 'xf-n': if (xf) { xf.n = +d.v; el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); } break;
    case 'tb-open': openTie(+d.id); break;
    case 'tb-move': if (tf) { const k = +d.k, j = k + (+d.d), o = tf.order; if (j >= 0 && j < o.length) { [o[k], o[j]] = [o[j], o[k]]; const box = document.getElementById('tb-list'); if (box) box.innerHTML = tieRows(); } } break;
    case 'tb-save': await saveTie(); break;
    case 'tb-clear': if (meObj().admin && armed(el, '한 번 더 누르면 공동 순위로 돌아가요')) { const g = Object.assign({}, game()); delete g.tb; if (await put('settings', 'game', g)) toast('공동 순위로 되돌렸어요.'); } break;
    case 'veiled': toast(veilMsg()); break;
    case 'cm-open': openComment(t, i); break;
    case 'cm-del': { const x = S.comments[d.id], me = meObj(); if (x && me && (x.by === me.id || me.admin) && armed(el, '한 번 더')) { if (await del('comments', d.id)) toast('댓글을 지웠어요.'); } break; }
    case 'tab': adminTab = d.tab; render(); break;
    case 'm-edit': openMember(d.id); break;
    case 'm-del': if (armed(el, '한 번 더 누르면 삭제돼요')) { closeSheet(); await del('members', d.id); toast('삭제했어요.'); } break;
    case 'bulk': openBulk(); break;
    case 'q-edit': openMission(d.id); break;
    case 'q-del': if (armed(el, '한 번 더 누르면 삭제돼요')) { const gone = S.missions[d.id]; closeSheet(); qf = null; if (await del('missions', d.id)) { if (gone) dropMissionImg(gone.img); toast('삭제했어요.'); } } break;
    case 'pick': el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'switch': el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true'); break;
    case 'toggle-set': if (meObj() && meObj().admin) { const cur = S.settings.main || {}; await put('settings', 'main', Object.assign({}, cur, { [d.key]: cur[d.key] === false })); } break;
    case 'reset-team': if (isMaster() && armed(el, '한 번 더')) { const ks = Object.keys(S.cells).filter(k => S.cells[k].team === t); for (const k of ks) { dropMedia(S.cells[k]); await del('cells', k); } dropComments(x => x.t === t); toast(`${t}조 빙고판을 초기화했어요.`); } break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'pf-file' && pf) addProofFiles([...e.target.files]);
  else if (e.target.id === 'qf-file' && qf) {
    const f = e.target.files[0], err = document.getElementById('qf-err'); err.hidden = true;
    if (!f) return;
    if (!f.type.startsWith('image/')) return showErr(err, '사진 파일만 올릴 수 있어요.');
    if (qf.url) URL.revokeObjectURL(qf.url);
    qf.file = f; qf.url = URL.createObjectURL(f); drawMissionMedia();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'login-form') {
    const err = document.getElementById('lg-err'), name = norm(document.getElementById('lg-name').value), pw = document.getElementById('lg-pw').value;
    const m = memberList().find(x => norm(x.name) === name);
    if (!m) return showErr(err, '명단에 없는 이름이에요. 이름을 다시 확인하거나 운영진에게 말해주세요.');
    pwOk(m, pw).then(ok => {
      if (!ok) return showErr(err, m.pwh ? '비밀번호가 맞지 않아요. 잊어버렸으면 운영진에게 말해주세요.' : '비밀번호가 맞지 않아요. 처음 비밀번호는 0000이에요.');
      meId = m.id; try { localStorage.setItem('oreurak:me', meId); } catch (x) {}
      location.hash = ''; render(); splash(m);
    });
  } else if (f.id === 'proof-form') submitProof();
  else if (f.id === 'member-form') saveMember(f);
  else if (f.id === 'bulk-form') saveBulk();
  else if (f.id === 'mission-form') saveMission(f);
  else if (f.id === 'problem-form') saveProblem(f);
  else if (f.id === 'pw-form') savePw();
  else if (f.id === 'extra-form') saveExtra();
  else if (f.id === 'give-form') saveGive();
  else if (f.id === 'cm-form') saveComment();
});
/* ── 칸 자리 바꾸기 ─────────────────────────
   채운 칸을 길게 눌러서(마우스는 그냥 끌어서) 다른 칸에 놓으면 두 칸의 내용이 서로 바뀐다. 가운데 칸은 움직이지 않는다. */
let drag = null, clickBlockUntil = 0;
const dragCell = el => { const c = el && el.closest ? el.closest('.board .cell') : null; return c && !c.classList.contains('ghost') ? c : null; };
function dragArm(cell, x, y, touch) {
  const t = +cell.dataset.t, i = +cell.dataset.i;
  dragEnd(false);
  if (!cell.classList.contains('done') || i === CENTER || !canChange(t) || !sheetEl.hidden || !fxEl.hidden) return;
  drag = { t, i, cell, sx: x, sy: y, x, y, on: false, over: null, ghost: null, timer: null, stale: false };
  if (touch) drag.timer = setTimeout(() => { if (drag) dragStart(drag.x, drag.y); }, 320);
}
function dragStart(x, y) {
  if (!drag || drag.on) return;
  if (!drag.cell.isConnected) return dragEnd(false);
  const r = drag.cell.getBoundingClientRect(), g = drag.cell.cloneNode(true);
  g.classList.remove('pop', 'line'); g.classList.add('ghost'); g.removeAttribute('href');
  g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
  drag.dx = Math.min(Math.max(x - r.left, 0), r.width); drag.dy = Math.min(Math.max(y - r.top, 0), r.height);
  drag.cell.parentElement.appendChild(g);
  drag.ghost = g; drag.on = true;
  drag.cell.classList.add('dragging'); document.body.classList.add('dragging');
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  dragMove(x, y);
}
function dragMove(x, y) {
  if (!drag || !drag.on) return;
  drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px';
  const el = dragCell(document.elementFromPoint(x, y));
  const ok = el && el !== drag.cell && +el.dataset.t === drag.t && +el.dataset.i !== CENTER ? el : null;
  if (ok !== drag.over) { if (drag.over) drag.over.classList.remove('drop'); if (ok) ok.classList.add('drop'); drag.over = ok; }
}
function dragEnd(commit) {
  if (!drag) return;
  const d = drag; drag = null; clearTimeout(d.timer); if (d.raf) cancelAnimationFrame(d.raf);
  if (d.ghost) d.ghost.remove();
  if (d.over) d.over.classList.remove('drop');
  d.cell.classList.remove('dragging'); document.body.classList.remove('dragging');
  if (d.on) clickBlockUntil = Date.now() + 450;
  if (commit && d.on && d.over) swapCells(d.t, d.i, +d.over.dataset.i);
  else if (d.stale) render();
}
/* 화면부터 바꾸고, 저장은 두 칸을 한 요청에 묶어서 순서대로 하나씩 보낸다.
   예전에는 두 칸을 따로 저장하고 저장이 끝나야 화면이 바뀌었다. 그래서 느린 회선에서 화면이 안 바뀐 줄 알고 한 번 더 끌거나
   두 번째 저장이 실패하면 한 칸이 복사되고 다른 칸이 사라졌다.
   빈 자리로 옮길 때도 원래 자리를 지우지 않고 '빈 칸' 표시를 같이 써서 한 요청으로 끝낸다(kind 가 없어서 빈 칸으로 보인다).
   저장이 하나라도 실패하면 뒤에 줄 선 것들은 버리고 서버 상태로 되돌린다. */
let swapChain = Promise.resolve(), swapGen = 0, swapPending = 0;
const staleStamps = new Set();
function swapCells(t, a, b) {
  if (a === b || a === CENTER || b === CENTER || !canChange(t)) return render();
  const cells = teamCells(t), ca = cells[a], cb = cells[b];
  if (!ca) return render();
  const ida = t + '-' + a, idb = t + '-' + b, sw = uid('');
  if (!cb && S.cells[idb]) dropMedia(S.cells[idb]);   /* 예전 방식 칸이 그 자리에 남아 있으면 치운다 */
  [ida, idb].forEach(k => { const c = S.cells[k]; if (c && c.sw) staleStamps.add(c.sw); });
  const rows = [{ col: 'cells', id: idb, data: Object.assign({}, ca, { idx: b, sw: sw + 'b' }) },
    { col: 'cells', id: ida, data: cb ? Object.assign({}, cb, { idx: a, sw: sw + 'a' }) : { team: t, idx: a, done: false, sw: sw + 'a' } }];
  epoch++; rows.forEach(r => { S.cells[r.id] = r.data; });
  popCell = idb; render();
  const gen = swapGen; swapPending++;
  swapChain = swapChain.then(async () => {
    let ok = gen === swapGen;
    try { if (ok) await adapter.setMany(rows); }
    catch (e) {
      console.error(e); ok = false; swapGen++;
      toast('자리를 바꾸지 못했어요. 연결 상태를 확인하고 다시 해주세요.');
      epoch++; try { await resync(true); } catch (x) {}
      render();
    }
    if (!--swapPending && ok) toast('자리를 바꿨어요.');
  });
  return swapChain;
}
app.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return dragEnd(false);
  const c = dragCell(e.target);
  if (c) dragArm(c, e.touches[0].clientX, e.touches[0].clientY, true);
}, { passive: true });
app.addEventListener('touchmove', e => {
  if (!drag) return;
  const p = e.touches[0];
  if (drag.on) {   /* 손가락이 움직일 때마다가 아니라 화면을 그릴 때 한 번만 따라간다(느린 폰에서 끊기지 않게) */
    e.preventDefault(); drag.x = p.clientX; drag.y = p.clientY;
    if (!drag.raf) drag.raf = requestAnimationFrame(() => { if (drag) { drag.raf = 0; dragMove(drag.x, drag.y); } });
  }
  else if (Math.hypot(p.clientX - drag.sx, p.clientY - drag.sy) > 10) dragEnd(false);   /* 끌기가 아니라 스크롤 */
  else { drag.x = p.clientX; drag.y = p.clientY; }
}, { passive: false });
app.addEventListener('touchend', e => {
  if (drag && drag.on) { if (e.cancelable) e.preventDefault(); dragMove(drag.x, drag.y); }   /* 손을 뗀 자리를 마지막으로 한 번 더 확인 */
  dragEnd(true);
});
app.addEventListener('touchcancel', () => dragEnd(false));
app.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  const c = dragCell(e.target);
  if (c) dragArm(c, e.clientX, e.clientY, false);
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerType !== 'mouse') return;
  if (drag.on) dragMove(e.clientX, e.clientY);
  else if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) dragStart(e.clientX, e.clientY);
});
window.addEventListener('pointerup', e => { if (drag && e.pointerType === 'mouse') dragEnd(true); });
app.addEventListener('dragstart', e => { if (dragCell(e.target)) e.preventDefault(); });
app.addEventListener('contextmenu', e => { const c = dragCell(e.target); if (c && c.classList.contains('done') && canEdit(+c.dataset.t)) e.preventDefault(); });
document.addEventListener('click', e => { if (Date.now() < clickBlockUntil && dragCell(e.target)) { e.preventDefault(); e.stopPropagation(); } }, true);

window.addEventListener('hashchange', () => { dragEnd(false); if (fxEl.querySelector('.zoom')) closeFx(); if (!sheetLock) closeSheet(); render(); });

boot();
</script>
